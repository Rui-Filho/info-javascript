<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>



    let x = prompt("x?", '')
    let n = prompt("n?", '')

    alert(pow(x, n))

 
    function pow(x, n) {

        if (n <= 0) {
          alert(`Power ${n} is not supported, please enter an integer number greater than zero`)
          return
        }

        let result=1

        for(let i=0;i<n;i++) {
            result*=x;
        }

        return result;
    }





  










    </script>
    
</body>
</html>
