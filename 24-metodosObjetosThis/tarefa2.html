<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa 2 - Calculadora</title>
</head>
<body>


    <script>

        let calculadora = {
            read(){
                this.a = +prompt("a?")
                this.b = +prompt("b?")

            },

            soma(){
                return this.a + this.b
            },

            multiplicação(){
                return this.a * this.b

            }
        }


        calculadora.read()
        alert(calculadora.soma())
        alert(calculadora.multiplicação())





    </script>
    
</body>
</html>
