    <script>


            let age = prompt('age?', 18);

            let message = (age < 3) ? 'Hi, baby!' :
            (age < 18) ? 'Hello!' :
            (age < 100) ? 'Greetings!' :
            'What an unusual age!';

            alert( message );


            /*  com if*/
                            if (age < 3) {
                message = 'Hi, baby!';
                } else if (age < 18) {
                message = 'Hello!';
                } else if (age < 100) {
                message = 'Greetings!';
                } else {
                message = 'What an unusual age!';
                }





    </script>
