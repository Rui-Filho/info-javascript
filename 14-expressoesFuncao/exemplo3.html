<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        //Funções de retorno de chamada - CALLBACK
        //

        function ask(pergunta, sim, nao) {
            if (confirm(pergunta)) {
              sim()
            } else {
              nao()
            }
            }
6
            function mostrarOk() {
              alert("Você concordou.");
              }

            function mostrarCancelado() {
              alert("Você cancelou a execução.");
              }

            ask("Você concorda?", mostrarOk,mostrarCancelado );



    </script>
    
</body>
</html>
