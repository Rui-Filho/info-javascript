<body>

    <script>

        function pow(x,n){

            if(n<1){
                alert(`A potência ${n} não é suportada, escolha um número positivo`)
                return
            }

            return x**n

        }


        alert(pow(prompt("x?"),prompt("N?")))








    </script>
